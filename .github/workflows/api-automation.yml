name: API Automation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: api-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Create Discount API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      workflow_status: ${{ steps.run-summary.outputs.workflow_status }}
      exec_summary: ${{ steps.run-summary.outputs.exec_summary }}
      artifact_name: ${{ steps.run-summary.outputs.artifact_name }}

    # Auto-login: Login API runs in beforeAll. Failed tests are recorded in Allure; job still succeeds.
    env:
      CI: true
      BASE_URL: ${{ secrets.BASE_URL }}
      AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      SERVICE_ID: ${{ secrets.SERVICE_ID }}
      PROVIDER_ID: ${{ secrets.PROVIDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright API tests
        id: playwright
        continue-on-error: true
        run: npx playwright test create-discount.api.spec.ts

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Capture run summary for notification
        id: run-summary
        if: always()
        run: |
          PLAYWRIGHT_OUTCOME="${{ steps.playwright.outcome }}"
          if [ "${PLAYWRIGHT_OUTCOME}" = "success" ]; then
            echo "workflow_status=Success" >> "${GITHUB_OUTPUT}"
          else
            echo "workflow_status=Completed with test failures" >> "${GITHUB_OUTPUT}"
          fi

          EXEC_SUMMARY="Playwright step: ${PLAYWRIGHT_OUTCOME}"
          if [ -f allure-report/widgets/summary.json ]; then
            PASSED=$(jq -r '.statistic.passed // 0' allure-report/widgets/summary.json)
            FAILED=$(jq -r '.statistic.failed // 0' allure-report/widgets/summary.json)
            SKIPPED=$(jq -r '.statistic.skipped // 0' allure-report/widgets/summary.json)
            TOTAL=$(jq -r '.statistic.total // 0' allure-report/widgets/summary.json)
            EXEC_SUMMARY="Total: ${TOTAL} | Passed: ${PASSED} | Failed: ${FAILED} | Skipped: ${SKIPPED} (Playwright: ${PLAYWRIGHT_OUTCOME})"
          fi
          echo "exec_summary=${EXEC_SUMMARY}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=allure-report-create-discount-${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Upload Allure report (ZIP download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-create-discount-${{ github.run_number }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-create-discount-${{ github.run_number }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Add workflow summary
        if: always()
        run: |
          {
            echo "## API automation run"
            echo ""
            echo "| Item | Value |"
            echo "|------|--------|"
            echo "| Playwright step | ${{ steps.playwright.outcome }} (failures are listed in Allure) |"
            echo "| Allure HTML (artifact) | Download **allure-report-create-discount-${{ github.run_number }}** from this run |"
            echo "| Allure HTML (online) | Published in the **publish-allure-report** job (GitHub Pages) |"
            echo ""
            echo "Failed tests remain **failed** in the Allure report (expected API gaps). The workflow continues so the report can be shared."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-allure-report:
    name: Publish Allure Report (GitHub Pages)
    runs-on: ubuntu-latest
    needs: api-tests
    if: always() && needs.api-tests.result != 'cancelled'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add publish summary
        run: |
          {
            echo "## Allure report published"
            echo ""
            echo "**View report:** ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "Share this URL with your team. Each workflow run replaces the site with the latest report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Google Chat notification
        if: always()
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: |
          if [ -z "${GOOGLE_CHAT_WEBHOOK}" ]; then
            echo "GOOGLE_CHAT_WEBHOOK secret is not set; skipping Google Chat notification."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPO="${GITHUB_REPOSITORY}"
          WORKFLOW_STATUS="${{ needs.api-tests.outputs.workflow_status }}"
          EXEC_SUMMARY="${{ needs.api-tests.outputs.exec_summary }}"
          ARTIFACT_NAME="${{ needs.api-tests.outputs.artifact_name }}"
          ALLURE_URL="${{ steps.deployment.outputs.page_url }}"

          if [ "${{ steps.deployment.outcome }}" = "success" ] && [ -n "${ALLURE_URL}" ]; then
            ALLURE_LINE="*Allure report (HTML):* ${ALLURE_URL}"
          else
            ALLURE_LINE="*Allure report (HTML):* unavailable (Pages deploy did not complete). Download artifact *${ARTIFACT_NAME}* from ${RUN_URL}"
          fi

          MESSAGE=$(printf '%s\n' \
            '*API Automation — GitHub Actions*' \
            '' \
            "*Workflow status:* ${WORKFLOW_STATUS}" \
            "*Repository:* ${REPO}" \
            "*Execution summary:* ${EXEC_SUMMARY}" \
            "*GitHub Actions run:* ${RUN_URL}" \
            '' \
            "${ALLURE_LINE}" \
            "*Allure artifact:* ${ARTIFACT_NAME} (Actions → Artifacts)")

          PAYLOAD=$(jq -n --arg text "${MESSAGE}" '{text: $text}')

          if ! curl -fsS -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "${PAYLOAD}" \
            "${GOOGLE_CHAT_WEBHOOK}"; then
            echo "::warning::Google Chat webhook notification failed."
            exit 0
          fi

          echo "Google Chat notification sent successfully."
